<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="vineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a7a2a"/>
      <stop offset="100%" stop-color="#1a4a1a"/>
    </linearGradient>
    <radialGradient id="moss1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a9a3a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#2d6a1d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a4a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5aaa4a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3a8a2a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a5a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moss3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6aba5a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4a9a3a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a6a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="highlight" cx="40%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7aca6a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7aca6a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Wall background -->
  <rect width="800" height="600" fill="url(#wallBg)"/>

  <!-- Subtle concrete texture -->
  <g opacity="0.04">
    <rect x="0" y="0" width="800" height="600" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="3 8"/>
    <rect x="0" y="0" width="800" height="600" fill="none" stroke="#666" stroke-width="0.3" stroke-dasharray="5 12"/>
  </g>

  <!-- Moss base layers -->
  <ellipse cx="200" cy="150" rx="120" ry="80" fill="url(#moss1)"/>
  <ellipse cx="400" cy="100" rx="140" ry="90" fill="url(#moss2)"/>
  <ellipse cx="600" cy="200" rx="130" ry="85" fill="url(#moss3)"/>
  <ellipse cx="150" cy="350" rx="100" ry="70" fill="url(#moss2)"/>
  <ellipse cx="550" cy="400" rx="110" ry="75" fill="url(#moss1)"/>
  <ellipse cx="380" cy="300" rx="150" ry="100" fill="url(#moss3)"/>
  <ellipse cx="250" cy="500" rx="130" ry="70" fill="url(#moss2)"/>
  <ellipse cx="650" cy="480" rx="100" ry="65" fill="url(#moss1)"/>

  <!-- Highlight -->
  <rect width="800" height="600" fill="url(#highlight)"/>

  <!-- Fern fronds - tall arching leaves -->
  <g filter="url(#softShadow)">
    <!-- Fern 1 -->
    <path d="M300 350 Q280 250 250 180 Q260 200 280 210 Q270 230 290 240 Q280 260 300 270 Q290 290 310 300 Q300 320 320 330Z" fill="#3a7a2a" opacity="0.85"/>
    <path d="M300 350 Q290 240 270 170 Q300 210 310 220 Q300 240 320 250 Q310 270 330 280 Q320 300 340 310Z" fill="#4a8a3a" opacity="0.7"/>
    <path d="M300 350 Q310 260 330 190 Q320 220 340 230 Q330 250 350 260 Q340 280 360 290Z" fill="#5a9a4a" opacity="0.6"/>

    <!-- Fern 2 -->
    <path d="M450 400 Q430 300 400 220 Q420 260 440 270 Q430 290 450 300 Q440 320 460 330 Q450 350 470 360Z" fill="#2d6a1d" opacity="0.85"/>
    <path d="M450 400 Q440 290 420 210 Q450 250 460 260 Q450 280 470 290 Q460 310 480 320 Q470 340 490 350Z" fill="#4a8a3a" opacity="0.7"/>
    <path d="M450 400 Q460 310 480 230 Q470 260 490 270 Q480 290 500 300 Q490 320 510 330Z" fill="#5a9a4a" opacity="0.6"/>

    <!-- Fern 3 -->
    <path d="M150 450 Q130 350 110 280 Q130 320 150 330 Q140 350 160 360 Q150 380 170 390 Q160 410 180 420Z" fill="#3a7a2a" opacity="0.75"/>
    <path d="M150 450 Q160 360 170 290 Q160 330 180 340 Q170 360 190 370 Q180 390 200 400Z" fill="#5a9a4a" opacity="0.55"/>

    <!-- Fern 4 -->
    <path d="M580 420 Q560 320 540 250 Q560 290 580 300 Q570 320 590 330 Q580 350 600 360 Q590 380 610 390Z" fill="#2d6a1d" opacity="0.8"/>
    <path d="M580 420 Q590 330 600 260 Q590 300 610 310 Q600 330 620 340 Q610 360 630 370Z" fill="#4a8a3a" opacity="0.65"/>

    <!-- Fern 5 -->
    <path d="M700 380 Q680 290 660 230 Q680 270 700 280 Q690 300 710 310 Q700 330 720 340Z" fill="#3a7a2a" opacity="0.7"/>
    <path d="M700 380 Q710 300 720 240 Q710 280 730 290 Q720 310 740 320Z" fill="#5a9a4a" opacity="0.55"/>

    <!-- Low ferns -->
    <path d="M80 500 Q70 430 60 380 Q80 420 100 430 Q90 450 110 460Z" fill="#4a8a3a" opacity="0.6"/>
    <path d="M750 480 Q740 420 730 370 Q750 410 770 420 Q760 440 780 450Z" fill="#4a8a3a" opacity="0.55"/>
  </g>

  <!-- Trailing vines -->
  <g opacity="0.6">
    <path d="M250 120 Q240 180 220 250 Q200 320 210 380 Q220 440 200 500" stroke="#2d6a1d" stroke-width="2.5" fill="none"/>
    <path d="M400 80 Q390 150 380 220 Q370 290 390 360 Q410 430 400 500" stroke="#3a7a2a" stroke-width="2" fill="none"/>
    <path d="M600 140 Q590 210 580 280 Q570 350 590 420 Q610 490 600 550" stroke="#2d6a1d" stroke-width="2.5" fill="none"/>
    <path d="M350 130 Q340 200 330 270 Q320 340 340 410" stroke="#4a8a3a" stroke-width="1.5" fill="none"/>
    <path d="M500 110 Q490 180 480 250 Q470 320 490 390 Q510 460 500 520" stroke="#3a7a2a" stroke-width="2" fill="none"/>
  </g>

  <!-- Small vine leaves on trailing vines -->
  <g opacity="0.5">
    <ellipse cx="230" cy="220" rx="8" ry="5" fill="#5a9a4a" transform="rotate(-30 230 220)"/>
    <ellipse cx="215" cy="320" rx="7" ry="4" fill="#4a8a3a" transform="rotate(20 215 320)"/>
    <ellipse cx="225" cy="430" rx="6" ry="4" fill="#6aba5a" transform="rotate(-15 225 430)"/>
    <ellipse cx="385" cy="200" rx="8" ry="5" fill="#5a9a4a" transform="rotate(25 385 200)"/>
    <ellipse cx="375" cy="350" rx="7" ry="4" fill="#6aba5a" transform="rotate(-20 375 350)"/>
    <ellipse cx="395" cy="450" rx="6" ry="4" fill="#4a8a3a" transform="rotate(15 395 450)"/>
    <ellipse cx="585" cy="260" rx="8" ry="5" fill="#5a9a4a" transform="rotate(-25 585 260)"/>
    <ellipse cx="575" cy="370" rx="7" ry="4" fill="#4a8a3a" transform="rotate(30 575 370)"/>
    <ellipse cx="595" cy="480" rx="6" ry="4" fill="#6aba5a" transform="rotate(-10 595 480)"/>
  </g>

  <!-- Moss detail clusters -->
  <g opacity="0.5">
    <circle cx="180" cy="120" r="15" fill="#5a9a4a"/>
    <circle cx="220" cy="100" r="12" fill="#4a8a3a"/>
    <circle cx="340" cy="80" r="18" fill="#6aba5a"/>
    <circle cx="420" cy="70" r="14" fill="#4a8a3a"/>
    <circle cx="560" cy="160" r="16" fill="#5a9a4a"/>
    <circle cx="630" cy="180" r="13" fill="#6aba5a"/>
    <circle cx="130" cy="300" r="14" fill="#5a9a4a"/>
    <circle cx="500" cy="350" r="17" fill="#6aba5a"/>
    <circle cx="680" cy="350" r="12" fill="#4a8a3a"/>
    <circle cx="300" cy="450" r="15" fill="#5a9a4a"/>
    <circle cx="450" cy="480" r="13" fill="#6aba5a"/>
  </g>

  <!-- Small flowers / accent dots -->
  <g opacity="0.35">
    <circle cx="260" cy="280" r="2" fill="#e8d4a0"/>
    <circle cx="265" cy="275" r="1.5" fill="#f0e0b0"/>
    <circle cx="480" cy="250" r="2.5" fill="#d4c8a0"/>
    <circle cx="160" cy="380" r="2" fill="#e8d4a0"/>
    <circle cx="620" cy="300" r="1.8" fill="#f0e0b0"/>
    <circle cx="350" cy="380" r="2" fill="#d4c8a0"/>
    <circle cx="530" cy="430" r="2.2" fill="#e8d4a0"/>
  </g>

  <!-- Ambient light overlay -->
  <ellipse cx="400" cy="200" rx="300" ry="200" fill="#ffffff" opacity="0.03"/>
</svg>
